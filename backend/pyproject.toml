[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ellensuly"
version = "0.1.0"
description = "Ellensúly — risk, in context. Directed risk-decision graph API."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ellensúly" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pymongo>=4.10",
  "networkx>=3.4",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.scripts]
ellensuly = "app.main:run"
ellensuly-seed = "app.seed.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
