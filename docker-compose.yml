services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ellensuly-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ellensuly
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8088,http://127.0.0.1:8088,http://localhost:5173
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ellensuly-mongo:
